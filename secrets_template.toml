# Paste this into your Streamlit Community Cloud app's
# Settings -> Secrets box (as TOML), then fill in real values.
# Fuel stations / EV charging / hotels / restaurants / restrooms need NONE
# of these -- that feature uses OpenStreetMap's free Overpass API only.

# REQUIRED for routing/directions (Tab 1) -- free, no card needed:
# https://openrouteservice.org/dev/#/signup
ORS_API_KEY = "your_real_key_here"

# OPTIONAL -- fallback/alternate geocoder if Nominatim rate-limits you:
# https://myprojects.geoapify.com
GEOAPIFY_API_KEY = ""

# OPTIONAL -- powers Claude-vision hazard reads (Tab 6) and AI lane-assist narration:
# https://console.anthropic.com/settings/keys
ANTHROPIC_API_KEY = ""

# OPTIONAL -- powers voice-assistant speech-to-text:
# https://console.groq.com/keys
GROQ_API_KEY = ""
